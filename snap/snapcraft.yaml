name: kesty-whatsapp
title: Kesty WhatsApp
version: '1.3.0'
summary: Unofficial WhatsApp client for Linux
description: |
  An unofficial WhatsApp client for Linux distributions made with love.
  It is concise, simple, easy and flexible to use. Built with Electron
  to provide a native desktop experience for WhatsApp Web.

  Features:
  - Native desktop experience for WhatsApp Web
  - Dark/Light theme support
  - System notifications and tray integration
  - Audio/video call support
  - Multi-architecture support
  - Secure and sandboxed via Snap packaging
grade: stable
confinement: strict
base: core22
contact: https://github.com/olubunmitosin/whatsapp/issues
issues: https://github.com/olubunmitosin/whatsapp/issues
source-code: https://github.com/olubunmitosin/whatsapp
website: https://github.com/olubunmitosin/whatsapp
license: CC0-1.0
architectures:
  - build-on: amd64
  - build-on: arm64
  - build-on: armhf

parts:
  electron:
    plugin: nil
    build-packages:
      - wget
      - unzip
    override-build: |
      # Download pre-built Electron for the target architecture
      # Electron only ships Linux binaries for x64, arm64, and armv7l.
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64) ELECTRON_ARCH=x64 ;;
        arm64) ELECTRON_ARCH=arm64 ;;
        armhf) ELECTRON_ARCH=armv7l ;;
        *) ELECTRON_ARCH=x64 ;;
      esac

      ELECTRON_VERSION="43.4.0"
      ELECTRON_URL="https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/electron-v${ELECTRON_VERSION}-linux-${ELECTRON_ARCH}.zip"

      echo "Downloading Electron v${ELECTRON_VERSION} for ${ELECTRON_ARCH}..."
      mkdir -p $CRAFT_PART_INSTALL/bin
      cd $CRAFT_PART_INSTALL/bin

      if wget -q "$ELECTRON_URL" -O electron.zip; then
        unzip -q electron.zip
        rm electron.zip
        chmod +x electron
        echo "Electron binary downloaded successfully"
      else
        echo "Failed to download Electron binary, creating placeholder"
        echo '#!/bin/bash\necho "Electron not available for this architecture"\nexit 1' > electron
        chmod +x electron
      fi
    prime:
      # Ship the entire Electron dist (binary, libffmpeg.so, resources/,
      # icudtl.dat, locales, etc.), not just the executable.
      - bin/

  kesty-whatsapp:
    plugin: nil
    source: .
    after: [electron]
    build-packages:
      - wget
      - build-essential
      - libnss3-dev
      - libatk-bridge2.0-dev
      - libdrm2
      - libxkbcommon0
      - libxss1
      - libasound2-dev
      - libxrandr2
      - libxdamage1
      - libxcomposite1
      - libxcursor1
      - libxtst6
      - libc6-dev
      - libx11-xcb1
      - libxcb-dri3-0
      - libgtk-3-0
    stage-packages:
      - libnss3
      - libxss1
      - libxrandr2
      - libasound2
      - libpangocairo-1.0-0
      - libatk1.0-0
      - libcairo-gobject2
      - libgtk-3-0
      - libgdk-pixbuf2.0-0
      - libxcomposite1
      - libxcursor1
      - libxdamage1
      - libxi6
      - libxtst6
      - libayatana-appindicator1
      - libdrm2
      - libxkbcommon0
      - libgbm1
      - libxfixes3
      - libatspi2.0-0
      - libsecret-1-0
      - libx11-6
      - libxau6
      - libxdmcp6
      - libxext6
      - libxinerama1
      - libxrender1
      - libavahi-client3
      - libavahi-common3
      - libcairo2
      - libcups2
      - libdatrie1
      - libepoxy0
      - libfontconfig1
      - libfribidi0
      - libgraphite2-3
      - libharfbuzz0b
      - libjpeg-turbo8
      - libnspr4
      - libpangoft2-1.0-0
      - libpixman-1-0
      - libthai0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libxcb1
      - libxcb-render0
      - libxcb-shm0
    override-build: |
      set -e

      # Install Node.js as a build-time tool only. The npm plugin normally does
      # this in its own build step, which override-build replaces, so it is done
      # here. The lockfile (v3) requires npm >= 9, so use the Node tarball rather
      # than the core22 archive's npm 8.
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64) NODE_ARCH=x64 ;;
        arm64) NODE_ARCH=arm64 ;;
        armhf) NODE_ARCH=armv7l ;;
        *) NODE_ARCH=x64 ;;
      esac
      NODE_VERSION="20.18.0"
      NODE_TARBALL="node-v${NODE_VERSION}-linux-${NODE_ARCH}.tar.gz"
      mkdir -p /tmp/node
      wget -q "https://nodejs.org/dist/v${NODE_VERSION}/${NODE_TARBALL}" -O /tmp/node.tar.gz
      tar -xzf /tmp/node.tar.gz -C /tmp/node --strip-components=1
      export PATH="/tmp/node/bin:$PATH"
      export ELECTRON_SKIP_BINARY_DOWNLOAD=1
      export npm_config_cache=/tmp/npm-cache

      # Install runtime dependencies only (devDependencies, including the
      # prebuilt Electron, are skipped). --ignore-scripts prevents the Electron
      # postinstall from downloading its binary.
      cd "$CRAFT_PART_BUILD"
      npm ci --ignore-scripts --production

      # Assemble the application into the part install dir
      cp -r main.js package.json app css images "$CRAFT_PART_INSTALL/"
      cp -r node_modules "$CRAFT_PART_INSTALL/"

apps:
  kesty-whatsapp:
    command: bin/electron $SNAP/main.js
    desktop: snap/gui/kesty-whatsapp.desktop
    environment:
      # X11 is the most compatible rendering path for the system tray
      DISABLE_WAYLAND: 1
    plugs:
      - desktop
      - desktop-legacy
      - home
      - x11
      - unity7
      - browser-support
      - network
      - gsettings
      - audio-playback
      - audio-record
      - camera
      - removable-media
      - screen-inhibit-control
      - wayland